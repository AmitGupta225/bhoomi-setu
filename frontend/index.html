<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/bhoomi-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a1628" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bhoomi Setu" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Bhoomi Setu | National Land Acquisition Portal</title>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased select-none">
    <div id="root"></div>
    <script>
      // Register Service Worker for Offline PWA Capabilities
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[Bhoomi Setu PWA] Service Worker registered:', reg.scope);
            })
            .catch((err) => {
              console.warn('[Bhoomi Setu PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
